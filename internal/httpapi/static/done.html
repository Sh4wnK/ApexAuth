<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApexAuth</title>
<style>
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:#0f1115; color:#e6e8eb; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { width:420px; max-width:92vw; background:#161a21; border:1px solid #262c36; border-radius:12px; padding:32px; text-align:center; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:#9aa3af; font-size:14px; margin:0 0 20px; }
  code { background:#0f1115; border:1px solid #262c36; padding:2px 6px; border-radius:4px; font-size:13px; word-break:break-all; }
</style>
</head>
<body>
  <div class="card">
    <h1>ApexAuth control plane</h1>
    <p>You're signed in as <strong>{{ .Email }}</strong></p>
    <p>Access token (demo):</p>
    <code>{{ .Token }}</code>
  </div>
</body>
</html>
